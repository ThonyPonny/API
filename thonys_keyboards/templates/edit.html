{% extends "base.html" %}

{% block title %}Editar Teclado{% endblock %}

{% block content %}
<h1>Editar Teclado</h1>

<form method="post" action="/update/{{ keyboard.id }}">
    <label>Nombre:</label>
    <input type="text" name="name" value="{{ keyboard.name }}" required>
    
    <label>Marca:</label>
    <input type="text" name="brand" value="{{ keyboard.brand }}" required>
    
    <label>Precio:</label>
    <input type="number" step="0.01" name="price" value="{{ keyboard.price }}" required>
    
    <button type="submit">Actualizar</button>
</form>
{% endblock %}
