{% extends "base.html" %}

{% block title %}Editar Teclado{% endblock %}

{% block content %}
<h1>Editar Teclado</h1>

<body>
    
    <!-- Formulario con JavaScript integrado -->
    <form id="editForm" onsubmit="return submitEditForm(event, {{ keyboard.id }})">
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" name="name" value="{{ keyboard.name }}" required class="form-control">
        </div>
        
        <div class="form-group">
            <label>Marca:</label>
            <input type="text" name="brand" value="{{ keyboard.brand }}" required class="form-control">
        </div>
        
        <div class="form-group">
            <label>Precio:</label>
            <input type="number" step="0.01" name="price" value="{{ keyboard.price }}" required class="form-control">
        </div>
        
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    </form>

    <!-- Script para manejar el envío -->
    <script>
    async function submitEditForm(event, id) {
        event.preventDefault(); // Evita el envío tradicional
        
        const formData = new FormData(event.target);
        
        try {
            const response = await fetch(`/update/${id}`, {
                method: 'PUT',
                body: formData
            });
            
            if (response.ok) {
                window.location.href = "/"; // Redirige al listado después de editar
            } else {
                alert("Error al actualizar");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Error de conexión");
        }
    }
    </script>
</body>
{% endblock %}
