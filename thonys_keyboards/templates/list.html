{% extends "base.html" %}

{% block content %}
<h1>Listado de Teclados</h1>

<input type="text" id="search" placeholder="Buscar teclados..." class="search-bar">

<table>
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Marca</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for keyboard in keyboards %}
        <tr>
            <td>{{ keyboard.name }}</td>
            <td>{{ keyboard.brand }}</td>
            <td>${{ keyboard.price }}</td>
            <td>
                <a href="/edit/{{ keyboard.id }}" class="btn-edit">✏️</a>
                <a href="/delete/{{ keyboard.id }}" class="btn-delete">🗑️</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
